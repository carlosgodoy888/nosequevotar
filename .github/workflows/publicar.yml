name: Publicar
on:
  push:
    branches: [main]
  # Cada noche se vuelve a construir para que las fechas (pasadas, próxima,
  # plazos del censo) se recalculen solas. 23:05 UTC son las 00:05 en Madrid
  # en invierno y las 01:05 en verano.
  schedule:
    - cron: '5 23 * * *'
  workflow_dispatch:
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/construir.mjs
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
